    // --- AUDIO SYNTHESIZER ENGINE (Zero-Dependency Web Audio API) ---
    const AudioEngine = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playTone(freq, type, duration, gainVal = 0.05) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      successChime() {
        if (this.muted) return;
        this.playTone(523.25, 'triangle', 0.1, 0.08); // C5
        setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.08), 70); // E5
        setTimeout(() => this.playTone(783.99, 'triangle', 0.18, 0.1), 140); // G5
        setTimeout(() => this.playTone(1046.50, 'triangle', 0.35, 0.12), 210); // C6
      },
      errorTone() {
        if (this.muted) return;
        this.playTone(200, 'sawtooth', 0.12, 0.08);
        setTimeout(() => this.playTone(140, 'sawtooth', 0.22, 0.08), 90);
      },
      terminalClick() {
        if (this.muted) return;
        this.playTone(850, 'sine', 0.02, 0.02);
      }
    };

    // --- TOAST NOTIFICATION GENERATOR ---
    function showToast(message, type = 'info', duration = 3200) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg border text-sm font-medium shadow-2xl transition-all duration-300 transform translate-y-2 opacity-0';
      
      let borderClass = 'border-cyber-border bg-obsidian-card text-slate-200';
      let iconSvg = '';

      if (type === 'success') {
        borderClass = 'border-cyber-emerald/70 bg-[#061e16] text-emerald-300 glow-emerald';
        iconSvg = `<svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
        AudioEngine.successChime();
      } else if (type === 'error') {
        borderClass = 'border-cyber-crimson/70 bg-[#250c0e] text-red-300 glow-crimson';
        iconSvg = `<svg class="w-5 h-5 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
        AudioEngine.errorTone();
      } else if (type === 'warning') {
        borderClass = 'border-cyber-amber/70 bg-[#241705] text-amber-300 glow-amber';
        iconSvg = `<svg class="w-5 h-5 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
      } else {
        borderClass = 'border-cyber-cyan/70 bg-[#08202a] text-cyan-300 glow-cyan';
        iconSvg = `<svg class="w-5 h-5 text-cyan-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
      }

      toast.className += ' ' + borderClass;
      toast.innerHTML = `${iconSvg}<div class="flex-1">${message}</div>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      });

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

      loadCustomLabs() {
        try {
          const raw = localStorage.getItem('hackrange_custom_labs_v2');
          if (raw) {
            const customs = JSON.parse(raw);
            if (Array.isArray(customs)) {
              customs.forEach(c => {
                if (!LABS_DATA.some(l => l.id === c.id)) {
                  LABS_DATA.push(c);
                }
              });
            }
          }
        } catch(e) {}
      },

      saveCustomLab(lab) {
        let customs = [];
        try {
          const raw = localStorage.getItem('hackrange_custom_labs_v2');
          if (raw) customs = JSON.parse(raw) || [];
        } catch(e) {}
        customs.push(lab);
        localStorage.setItem('hackrange_custom_labs_v2', JSON.stringify(customs));
        if (!LABS_DATA.some(l => l.id === lab.id)) {
          LABS_DATA.push(lab);
        }
      },

      loadBestTimes() {
        try {
          const raw = localStorage.getItem('hackrange_speedruns_v2');
          if (raw) this.stopwatch.bestTimes = JSON.parse(raw);
        } catch(e) {}
      },

      saveBestTime(labId, sec) {
        if (!this.stopwatch.bestTimes[labId] || sec < this.stopwatch.bestTimes[labId]) {
          this.stopwatch.bestTimes[labId] = sec;
          localStorage.setItem('hackrange_speedruns_v2', JSON.stringify(this.stopwatch.bestTimes));
        }
      },

      getUsers() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.USERS);
          if (raw) return JSON.parse(raw);
        } catch(e) {}
        this.saveUsers(DEFAULT_USERS);
        return DEFAULT_USERS;
      },

      saveUsers(users) {
        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
      },

      loadUsers() {
        const users = this.getUsers();
        if (!users || users.length === 0) {
          this.saveUsers(DEFAULT_USERS);
        }
      },

      loadSession() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.SESSION);
          if (raw) {
            const user = JSON.parse(raw);
            // Refresh with latest stored data
            const all = this.getUsers();
            const fresh = all.find(u => u.email === user.email);
            this.currentUser = fresh || user;
          }
        } catch(e) {
          this.currentUser = null;
        }
      },

      saveSession(user) {
        this.currentUser = user;
        if (user) {
          localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(user));
        } else {
          localStorage.removeItem(STORAGE_KEYS.SESSION);
        }
      },

      updateCurrentUser(updates) {
        if (!this.currentUser) return;
        Object.assign(this.currentUser, updates);
        this.saveSession(this.currentUser);

        // Update in users registry
        const all = this.getUsers();
        const idx = all.findIndex(u => u.email === this.currentUser.email);
        if (idx !== -1) {
          all[idx] = { ...all[idx], ...updates };
          this.saveUsers(all);
        }
      },

      isLabSolved(labId) {
        if (!this.currentUser) return false;
        return (this.currentUser.solvedLabs || []).includes(labId);
      },

      markLabSolved(labId, pointsAward = 50) {
        if (!this.currentUser) return;
        const currentSolved = this.currentUser.solvedLabs || [];
        if (!currentSolved.includes(labId)) {
          const nextSolved = [...currentSolved, labId];
          const nextXp = (this.currentUser.xp || 0) + pointsAward;
          this.updateCurrentUser({ solvedLabs: nextSolved, xp: nextXp });
          showToast(`🏆 Lab #${labId} Completed! +${pointsAward} XP Awarded!`, 'success', 4000);
        }
      },

      setupMachineTimer() {
        if (this.machine.timerInterval) clearInterval(this.machine.timerInterval);
        this.machine.timerInterval = setInterval(() => {
          if (this.machine.status === 'RUNNING' && this.machine.remainingSec > 0) {
            this.machine.remainingSec--;
            if (this.machine.remainingSec === 0) {
              this.machine.status = 'STOPPED';
              showToast('Target Machine session lease expired. Instance terminated.', 'warning');
              renderApp();
            } else if (this.machine.remainingSec % 60 === 0) {
              const timerEl = document.getElementById('machine-timer-display');
              if (timerEl) timerEl.textContent = formatTimer(this.machine.remainingSec);
            }
          }
        }, 1000);
      }
    };

    function formatTimer(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // Auth tab switcher
    function switchAuthTab(tab) {
      const signinForm = document.getElementById('signin-form');
      const signupForm = document.getElementById('signup-form');
      const signinBtn = document.getElementById('auth-tab-signin');
      const signupBtn = document.getElementById('auth-tab-signup');
      if (!signinForm || !signupForm) return;

      if (tab === 'signup') {
        signinForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        signupBtn.className = 'flex-1 py-2 text-xs font-mono font-semibold rounded-md transition bg-cyber-cyan text-black shadow font-bold';
        signinBtn.className = 'flex-1 py-2 text-xs font-mono font-semibold rounded-md transition text-slate-400 hover:text-white';
      } else {
        signupForm.classList.add('hidden');
        signinForm.classList.remove('hidden');
        signinBtn.className = 'flex-1 py-2 text-xs font-mono font-semibold rounded-md transition bg-cyber-emerald text-black shadow font-bold';
        signupBtn.className = 'flex-1 py-2 text-xs font-mono font-semibold rounded-md transition text-slate-400 hover:text-white';
      }
    }

    function setupAuthEvents() {
      // Setup handled directly in HTML onclick attributes
    }

    function handleSignInSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('signin-email').value.trim();
      const pass = document.getElementById('signin-password').value;

      const users = AppState.getUsers();
      const found = users.find(u => u.email.toLowerCase() === email.toLowerCase());

      if (found && found.password === pass) {
        AppState.saveSession(found);
        showToast(`Welcome back, Operator ${found.callsign}! Access granted.`, 'success');
        renderApp();
      } else if (found) {
        showToast('Invalid credentials. Check your password.', 'error');
      } else {
        showToast('Operator email not registered. Please Sign Up First.', 'error');
      }
    }

    function handleSignUpSubmit(e) {
      e.preventDefault();
      const callsign = document.getElementById('signup-callsign').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const pass = document.getElementById('signup-password').value;

      const users = AppState.getUsers();
      if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        showToast('An operator with this email already exists. Please Sign In.', 'warning');
        switchAuthTab('signin');
        return;
      }

      const newCadet = {
        id: 'usr_' + Date.now(),
        callsign: callsign,
        email: email,
        password: pass,
        role: 'cadet',
        xp: 0,
        joined: new Date().toISOString().split('T')[0],
        solvedLabs: []
      };

      users.push(newCadet);
      AppState.saveUsers(users);

      showToast(`Cadet account created! Now Sign In with your credentials.`, 'success', 4000);
      switchAuthTab('signin');

      const signinEmail = document.getElementById('signin-email');
      if (signinEmail) signinEmail.value = email;
    }

    function instantLoginAdmin() {
      const users = AppState.getUsers();
      const admin = users.find(u => u.email === 'tushar@hackrange.io');
      if (admin) {
        AppState.saveSession(admin);
        showToast('Root Admin Session Initialized! Welcome, Tushar_Admin.', 'success');
        renderApp();
      }
    }

    function instantLoginCadet() {
      const users = AppState.getUsers();
      const cadet = users.find(u => u.email === 'cadet@hackrange.io');
      if (cadet) {
        AppState.saveSession(cadet);
        showToast('Cadet Session Initialized! Welcome, CyberCadet_01.', 'success');
        renderApp();
      }
    }

    function handleLogout() {
      AppState.saveSession(null);
      showToast('Logged out of HackRange. Session cleared.', 'info');
      renderApp();
    }

    function typeToTerminal(cmd) {
      AudioEngine.terminalClick();
      const input = document.getElementById('terminal-input');
      if (input) {
        const firstLine = cmd.split('\n')[0].trim();
        input.value = firstLine;
        input.focus();
        showToast('Command inserted into AttackBox prompt!', 'info', 1800);
      }
    }

    function switchRefTab(tab) {
      const offTab = document.getElementById('ref-tab-offensive');
      const defTab = document.getElementById('ref-tab-defensive');
      const offContent = document.getElementById('ref-content-offensive');
      const defContent = document.getElementById('ref-content-defensive');
      if (!offTab || !defTab || !offContent || !defContent) return;

      if (tab === 'offensive') {
        AppState.labTab = 'overview';
        offTab.className = 'flex-1 py-1.5 text-xs font-mono font-bold rounded-md transition bg-cyber-emerald/20 text-cyber-emerald border border-cyber-emerald/40';
        defTab.className = 'flex-1 py-1.5 text-xs font-mono font-bold rounded-md transition text-slate-400 hover:text-white';
        offContent.classList.remove('hidden');
        defContent.classList.add('hidden');
      } else {
        AppState.labTab = 'manual';
        defTab.className = 'flex-1 py-1.5 text-xs font-mono font-bold rounded-md transition bg-cyber-cyan/20 text-cyber-cyan border border-cyber-cyan/40';
        offTab.className = 'flex-1 py-1.5 text-xs font-mono font-bold rounded-md transition text-slate-400 hover:text-white';
        defContent.classList.remove('hidden');
        offContent.classList.add('hidden');
      }
    }

    function toggleHint(taskId) {
      const el = document.getElementById(`hint-${taskId}`);
      if (el) el.classList.toggle('hidden');
    }

    function handleTaskSubmit(e, taskId, labId) {
      e.preventDefault();
      const input = document.getElementById(`input-${taskId}`);
      if (!input) return;
      const userAns = input.value.trim();

      const lab = LABS_DATA.find(l => l.id === labId);
      if (!lab) return;
      const task = lab.tasks.find(t => t.id === taskId);
      if (!task) return;

      const normalize = s => s.toLowerCase().replace(/['"]/g, '').trim();
      const isCorrect = normalize(userAns) === normalize(task.answer);

      if (isCorrect) {
        input.classList.remove('border-cyber-border', 'border-red-500');
        input.classList.add('border-cyber-emerald', 'bg-emerald-950/20');

    // --- TARGET MACHINE PROVISIONING ACTIONS ---
    function startMachine() {
      AppState.machine.status = 'STARTING';
      showToast('Spinning up isolated sandbox target at 10.10.142.50...', 'info');
      renderApp();

      setTimeout(() => {
        AppState.machine.status = 'RUNNING';
        AppState.machine.remainingSec = 3600;
        AppState.stopwatch.seconds = 0;
        AppState.stopwatch.running = true;
        if (AppState.stopwatch.interval) clearInterval(AppState.stopwatch.interval);
        AppState.stopwatch.interval = setInterval(() => {
          if (AppState.stopwatch.running) {
            AppState.stopwatch.seconds++;
            const speedEl = document.getElementById('speedrun-timer-display');
            if (speedEl) speedEl.textContent = formatTimer(AppState.stopwatch.seconds);
          }
        }, 1000);
        showToast('Target Machine 10.10.142.50 is now ONLINE! 1 hour lease allocated.', 'success');
        renderApp();
      }, 1500);
    }

    function terminateMachine() {
      AppState.machine.status = 'TERMINATING';
      AppState.stopwatch.running = false;
      if (AppState.stopwatch.interval) clearInterval(AppState.stopwatch.interval);
      showToast('Tearing down container routes and destroying sandbox instance...', 'info');
      renderApp();

      setTimeout(() => {
        AppState.machine.status = 'STOPPED';
        showToast('Target machine terminated cleanly.', 'info');
        renderApp();
      }, 1000);
    }

    function extendMachineTimer() {
      if (AppState.machine.status === 'RUNNING') {
        AppState.machine.remainingSec += 3600;
        showToast('Added +1 hour to target machine lease.', 'success');
        const timerEl = document.getElementById('machine-timer-display');
        if (timerEl) timerEl.textContent = formatTimer(AppState.machine.remainingSec);
      }
    }

    function renderTerminalLines() {
      const body = document.getElementById('terminal-body');
      if (!body) return;
      body.innerHTML = AppState.terminal.lines.map(line => {
        if (line.type === 'input') {
          return `<div class="text-slate-200"><span class="text-cyber-emerald font-bold">cadet@attackbox#</span> ${escapeHtml(line.text)}</div>`;
        } else if (line.type === 'success') {
          return `<div class="text-emerald-400 font-bold">${escapeHtml(line.text)}</div>`;
        } else if (line.type === 'error') {
          return `<div class="text-red-400">${escapeHtml(line.text)}</div>`;
        } else if (line.type === 'accent') {
          return `<div class="text-cyber-cyan font-semibold">${escapeHtml(line.text)}</div>`;
        } else {
          return `<div class="text-slate-400 whitespace-pre-wrap">${escapeHtml(line.text)}</div>`;
        }
      }).join('');
      body.scrollTop = body.scrollHeight;

      renderApp();

    function selectSiemRule(ruleId) {
      AppState.selectedRuleId = ruleId;
      AppState.siemEvaluatedRule = null;
      renderApp();
    }

    function evaluateSiemRule() {
      const rule = DEFENSIVE_RULES.find(r => r.id === AppState.selectedRuleId);
      if (!rule) return;
      AudioEngine.terminalClick();
      AppState.siemEvaluatedRule = rule;

      if (!AppState.evaluatedRulesWon.includes(rule.id)) {
        AppState.evaluatedRulesWon.push(rule.id);
        if (AppState.currentUser) {
          AppState.updateCurrentUser({ xp: (AppState.currentUser.xp || 0) + 50 });
        }
        AudioEngine.victory();
        showToast(`Rule Validated! +50 XP Awarded for ${rule.name}`, 'success');
      } else {
        AudioEngine.terminalClick();
        showToast(`Rule Matched ${rule.matches.length} Telemetry Events!`, 'info');
      }
      renderApp();
    }

    // --- ADMIN BACKUP & DISASTER RECOVERY ACTIONS ---
    function exportRangeBackup() {
      AudioEngine.terminalClick();
      const backupData = {
        version: "2.4",
        timestamp: new Date().toISOString(),
        users: AppState.getUsers(),
        session: AppState.currentUser,
        bestTimes: AppState.stopwatch.bestTimes || {},
        termTheme: AppState.termTheme,
        termFontSize: AppState.termFontSize
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `hackrange_backup_${new Date().toISOString().replace(/[:.]/g, '-')}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();

      showToast("Range snapshot JSON exported successfully!", "success");
    }

    function importRangeBackup(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && Array.isArray(parsed.users)) {
            AppState.saveUsers(parsed.users);
            if (parsed.session) {
              AppState.saveSession(parsed.session);
            }
            if (parsed.bestTimes) {
              AppState.stopwatch.bestTimes = parsed.bestTimes;
              localStorage.setItem('hackrange_speedruns_v2', JSON.stringify(parsed.bestTimes));
            }
            if (parsed.termTheme) AppState.termTheme = parsed.termTheme;
            if (parsed.termFontSize) AppState.termFontSize = parsed.termFontSize;

            showToast("Backup restored successfully! Refreshing enclave state...", "success", 2500);
            setTimeout(() => {
              renderApp();
            }, 600);
          } else {
            showToast("Invalid backup file: missing users array.", "error");
          }
        } catch (err) {
          showToast("Failed to parse backup JSON file.", "error");
        }
      };
      reader.readAsText(file);
    }

      if (!confirm("CAUTION: This will delete all custom cadet accounts and reset all lab progress to factory state. Are you sure?")) {

      localStorage.removeItem(STORAGE_KEYS.USERS);

    function handleCreateCustomLab(e) {
      e.preventDefault();
      AudioEngine.terminalClick();
      const title = document.getElementById('studio-title').value.trim();
      const category = document.getElementById('studio-category').value;
      const difficulty = document.getElementById('studio-diff').value;
      const badge = document.getElementById('studio-badge').value.trim();
      const scenario = document.getElementById('studio-scenario').value.trim();
      const executionGuide = document.getElementById('studio-exec').value.trim();
      const defenseGuide = document.getElementById('studio-defense').value.trim();
      const q = document.getElementById('studio-q').value.trim();
      const ans = document.getElementById('studio-ans').value.trim();
      const hint = document.getElementById('studio-hint').value.trim() || 'Review the offensive guide commands carefully.';
      let flag = document.getElementById('studio-flag').value.trim();

      if (!flag.startsWith('THM{')) {
        flag = `THM{${flag.replace(/[^a-zA-Z0-9_]/g, '_')}}`;
      }

      const xpMap = { 'Easy': 150, 'Medium': 200, 'Hard': 250, 'Insane': 300 };
      const newId = LABS_DATA.length + 1;

      const newLab = {
        id: newId,
        title: title,
        category: category,
        difficulty: difficulty,
        xp: xpMap[difficulty] || 200,
        badge: badge,
        targetIp: "10.10.142.50",
        scenario: scenario,
        tasks: [
          {
            id: `${newId}-1`,
            question: q,
            formatMask: ans.length > 5 ? `${ans.slice(0, 2)}${'*'.repeat(ans.length - 2)}` : '***',
            answer: ans,
            hint: hint
          }
        ],
        flag: flag,
        executionGuide: executionGuide,
        defenseGuide: defenseGuide
      };

      AppState.saveCustomLab(newLab);
      showToast(`🎉 Custom Lab #${newId} "${title}" Published to HackRange!`, 'success', 4000);
      navigateView('lab-detail', newId);
    }

    function copyToClipboard(text, successMsg = 'Copied to clipboard!') {
      AudioEngine.terminalClick();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(successMsg, 'success');
        }).catch(() => {
          fallbackCopyText(text, successMsg);
        });
      } else {
        fallbackCopyText(text, successMsg);
      }
    }

    function fallbackCopyText(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(successMsg, 'success');
      } catch (err) {
        showToast('Unable to auto-copy. Select and press Ctrl+C.', 'warning');
      }
      document.body.removeChild(ta);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    }

    function setupAppEvents() {
      // Auto-scroll terminal if visible
      const termBody = document.getElementById('terminal-body');
      if (termBody) termBody.scrollTop = termBody.scrollHeight;

      // Terminal command history navigation with ArrowUp / ArrowDown
      const termInput = document.getElementById('terminal-input');
      if (termInput) {
        termInput.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (AppState.terminal.history.length > 0 && AppState.terminal.historyIdx < AppState.terminal.history.length - 1) {
              AppState.terminal.historyIdx++;
              termInput.value = AppState.terminal.history[AppState.terminal.history.length - 1 - AppState.terminal.historyIdx] || '';
            }
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (AppState.terminal.historyIdx > 0) {
              AppState.terminal.historyIdx--;
              termInput.value = AppState.terminal.history[AppState.terminal.history.length - 1 - AppState.terminal.historyIdx] || '';
            } else if (AppState.terminal.historyIdx === 0) {
              AppState.terminal.historyIdx = -1;
              termInput.value = '';
            }
          }
        });
      }
    }

    // --- INITIALIZE APPLICATION ON DOM READY ---
    window.addEventListener('DOMContentLoaded', () => {
      AppState.init();
      renderApp();
    });
  </script>
</body>
</html>
